# nginx: serve the aptwarden status page, LAN only AND with a password.
# Include inside the server { } block of an HTTPS vhost.
location = /aptwarden { return 301 /aptwarden/; }

location /aptwarden/ {
    alias /var/www/aptwarden/;
    index index.html;

    # both conditions must hold
    satisfy all;
    allow 192.168.11.0/24;        # adjust to your LAN / VPN ranges
    deny all;
    auth_basic "aptwarden";
    auth_basic_user_file /etc/nginx/aptwarden.htpasswd;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
