# aptwarden configuration, usually /etc/aptwarden/config.yaml
# Every key is optional except `hosts`; the values shown are the defaults.

state_dir: /var/lib/aptwarden      # run history (state.db)
cache_dir: /var/cache/aptwarden    # feed cache (cache.db), safe to delete
max_parallel: 4                    # hosts inventoried in parallel
keep_runs: 100                     # runs kept in state.db

log:
  level: info                      # debug | info | warning | error
  format: auto                     # auto (text on a terminal, JSON otherwise) | json | text

ssh:                               # defaults for all hosts, overridable per host
  user: aptwarden
  helper: /usr/local/lib/aptwarden/aptwarden-helper
  port: 22
  identity_file: /etc/aptwarden/ssh/id_ed25519
  known_hosts_file: /var/lib/aptwarden/known_hosts
  strict_host_key_checking: "yes"  # "yes" or "accept-new" (trust on first use)
  connect_timeout: 10
  command_timeout: 300
  options: {}                      # extra ssh -o options, e.g. {ProxyJump: bastion}

sources:
  debian_tracker:
    enabled: true
    refresh_interval: 1h           # minimum time between feed checks
    max_age: 3d                    # warn if the feed could not be verified for this long
  osv:
    enabled: true
  custom:                          # own definitions from a Git repository
    enabled: false
    url: https://github.com/ramhee98/aptwarden-definitions.git
    ref: signed-tags               # signed-tags: newest signed vYYYY.MM.DD tag (recommended)
                                   # branch: follow `branch` WITHOUT verification (forks, tests)
    branch: main
    allowed_signers_file: /etc/aptwarden/allowed_signers   # keys whose tags are trusted
    path: definitions              # directory inside the repository
    refresh_interval: 1h

enrich:
  cvss:
    enabled: true
    nvd:
      enabled: true
      api_key_file: null           # e.g. nvd-api-key (free key: https://nvd.nist.gov/developers)
      budget: 1m                   # time spent on rate-limited NVD lookups per run
  kev:
    enabled: true
    refresh_interval: 24h

report:
  min_severity: high               # text report hides fixable packages below this
                                   # (KEV and unscored packages are always shown)
  show: fixable                    # fixable | all

notify:
  summary: always                  # always | changes | never (per-run summary)
  subject_prefix: "[aptwarden]"
  alert:                           # immediate alerts, once per host + vulnerability
    min_severity: critical         # new findings at or above this severity
    kev: true                      # ... or listed in CISA KEV, regardless of severity
    host_errors: true              # a host that starts failing
    remind_after: 7d               # alert again if still present (0 = never)
  email:
    enabled: false
    host: 192.0.2.25
    port: 25
    security: starttls             # starttls (required) | ssl (implicit TLS, port 465) | none
    tls_verify: true
    tls_server_name: null          # certificate name if `host` is an IP, e.g. mx.example.org
    username: null                 # SMTP AUTH, optional
    password_file: null            # e.g. smtp-password (see Secrets)
    from: aptwarden@example.org
    to: [admin@example.org]
    timeout: 30

status_page:                       # static HTML page, rewritten after every run
  enabled: true
  path: null                       # default: <state_dir>/www/index.html
  mode: "0640"

proxmox:                           # needed for snapshot provider proxmox
  url: https://192.0.2.9:8006
  node: pve1
  token_id: aptwarden@pve!central
  token_file: credentials/proxmox-token
  tls_fingerprint: null            # "AB:CD:..." pins the API certificate (SHA-256)
  ca_file: null                    # or verify against a CA file
  timeout: 30
  task_timeout: 600

snapshots:
  keep: 7d                         # aptwarden's own snapshots are deleted after this
  vmstate: false                   # QEMU only: include RAM state

policy:                            # defaults for every host, overridable per host
  modes: [report]                  # report | dry-run | patch
  auto_patch_severities: [critical, high]
  auto_patch_kev: true
  window: []                       # e.g. ["Mon..Fri 02:00-04:00"]; empty = any time
  restart: auto                    # needrestart: auto | list | off
  reboot: never                    # never | if-required
  rollback: auto                   # auto | manual
  allow_without_snapshot: false
  allow_extra_upgrades: false      # dependency upgrades outside the plan
  allow_new_packages: []           # packages that may be newly installed

health:                            # timing of the post-patch healthchecks
  grace: 10s
  retries: 6
  interval: 5s

hosts:
  # A simple web service in an LXC container: the typical auto-patch candidate.
  - name: web01
    address: 192.0.2.10
    snapshot: {provider: proxmox, vmid: 101, type: lxc}
    policy:
      modes: [report, dry-run, patch]
      window: ["Mon..Fri 02:00-04:00"]
    healthchecks:
      - systemd: apache2.service
      - http: https://web01.example.org/
        expect_status: [200, 301, 302]
        verify_tls: true

  # WordPress with Apache, PHP-FPM and MariaDB in one LXC. aptwarden covers the
  # Debian packages (PHP, Apache, MariaDB, OpenSSL); WordPress core, plugins and
  # themes installed through WordPress itself are not covered, keep its own
  # auto-updates for those. A rollback also resets the database to the snapshot:
  # fine for a brochure site, use rollback: manual for shops or sites with comments.
  - name: wordpress01
    address: 192.0.2.14
    snapshot: {provider: proxmox, vmid: 104, type: lxc}
    policy:
      modes: [report, dry-run, patch]
      window: ["Mon..Fri 03:00-04:00"]
      rollback: manual
    health: {grace: 20s, retries: 6, interval: 5s}   # PHP-FPM needs a moment after restarts
    healthchecks:
      - systemd: apache2.service
      - systemd: php8.4-fpm.service   # php8.2-fpm.service on Debian 12
      - systemd: mariadb.service
      - http: https://blog.example.org/
        expect_status: 200
        contains: "</html>"           # a PHP or database error page fails this
      - http: https://blog.example.org/wp-login.php
        expect_status: 200

  # Pi-hole in an LXC. Pi-hole itself (pihole-FTL, which includes the DNS server)
  # comes from its own installer, not from Debian: update it with `pihole -up`;
  # aptwarden covers the Debian packages underneath. Patching interrupts DNS for
  # every client briefly, so use a night window, and give a second Pi-hole a
  # different one. Use IP addresses here: the patch run must not depend on the
  # DNS server it is patching.
  - name: pihole01
    address: 192.0.2.15
    snapshot: {provider: proxmox, vmid: 105, type: lxc}
    policy:
      modes: [report, dry-run, patch]
      window: ["Mon..Fri 04:00-04:30"]
    # on_host: checked on the Pi-hole itself over SSH, so the central host needs no
    # firewall opening for DNS and HTTPS into this network, only SSH
    healthchecks:
      - systemd: pihole-FTL.service
      - tcp: 127.0.0.1:53             # DNS (pihole-FTL also listens on TCP)
        on_host: true
      - http: https://127.0.0.1/admin/
        on_host: true                 # needs curl on the Pi-hole
        expect_status: [200, 302]     # 302: redirect to the login page
        verify_tls: false             # Pi-hole's default certificate is self-signed

  # The nginx reverse proxy: many services depend on it, so check the proxied
  # sites too, not only nginx itself.
  - name: proxy01
    address: 192.0.2.11
    snapshot: {provider: proxmox, vmid: 102, type: lxc}
    policy:
      modes: [report, dry-run, patch]
      window: ["Tue,Thu 03:00-04:00"]
    healthchecks:
      - systemd: nginx.service
      - tcp: 192.0.2.11:443
      - http: https://app.example.org/healthz
        expect_status: 200
        contains: "ok"           # optional: text the response must contain

  # Proxmox Mail Gateway (Debian based). A rollback would discard mail received
  # after the snapshot: start with report and dry-run, later patch with a
  # manual rollback.
  - name: pmg01
    address: 192.0.2.12
    snapshot: {provider: proxmox, vmid: 103, type: qemu}
    policy:
      modes: [report, dry-run]   # add patch once the dry-run plans look right
      rollback: manual
      window: ["Sun 04:00-05:00"]
    healthchecks:
      - systemd: postfix.service
      - systemd: pmg-smtp-filter.service
      - systemd: pmgproxy.service
      - tcp: 192.0.2.12:25

  # mailcow on Docker: aptwarden reports the host's Debian packages, not the
  # container images (update those with mailcow's update.sh). An upgrade of
  # docker-ce or containerd restarts every container, so keep this host on report.
  - name: mailcow01
    address: 192.0.2.13
    ssh: {port: 2222}            # per-host SSH overrides
    policy:
      modes: [report]

  # The Proxmox VE node itself: report only. Proxmox needs `apt full-upgrade`
  # and the node cannot snapshot itself, so never patch it with aptwarden.
  - name: pve01
    address: 192.0.2.2
    policy:
      modes: [report]

  # The central aptwarden host itself (no SSH needed): report only.
  - name: aptwarden
    transport: local
