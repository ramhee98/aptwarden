# aptwarden configuration, usually /etc/aptwarden/config.yaml
# Every key is optional except `hosts`; the values shown are the defaults.

state_dir: /var/lib/aptwarden      # run history (state.db)
cache_dir: /var/cache/aptwarden    # feed cache (cache.db), safe to delete
max_parallel: 4                    # hosts inventoried in parallel
keep_runs: 100                     # runs kept in state.db

log:
  level: info                      # debug | info | warning | error
  format: auto                     # auto (text on a terminal, JSON otherwise) | json | text

ssh:                               # defaults for all hosts, overridable per host
  user: aptwarden
  port: 22
  identity_file: /etc/aptwarden/ssh/id_ed25519
  known_hosts_file: /var/lib/aptwarden/known_hosts
  strict_host_key_checking: "yes"  # "yes" or "accept-new" (trust on first use)
  connect_timeout: 10
  command_timeout: 300
  options: {}                      # extra ssh -o options, e.g. {ProxyJump: bastion}

sources:
  debian_tracker:
    enabled: true
    refresh_interval: 1h           # minimum time between feed checks
    max_age: 3d                    # warn if the feed could not be verified for this long
  osv:
    enabled: true
  custom:                          # own definitions from a Git repository
    enabled: false
    url: https://github.com/ramhee98/aptwarden-definitions.git
    ref: signed-tags               # signed-tags: newest signed vYYYY.MM.DD tag (recommended)
                                   # branch: follow `branch` WITHOUT verification (forks, tests)
    branch: main
    allowed_signers_file: /etc/aptwarden/allowed_signers   # keys whose tags are trusted
    path: definitions              # directory inside the repository
    refresh_interval: 1h

enrich:
  cvss:
    enabled: true
    nvd:
      enabled: true
      api_key_file: null           # e.g. nvd-api-key (free key: https://nvd.nist.gov/developers)
      budget: 1m                   # time spent on rate-limited NVD lookups per run
  kev:
    enabled: true
    refresh_interval: 24h

report:
  min_severity: high               # text report hides fixable packages below this
                                   # (KEV and unscored packages are always shown)
  show: fixable                    # fixable | all

notify:
  summary: always                  # always | changes | never (per-run summary)
  subject_prefix: "[aptwarden]"
  alert:                           # immediate alerts, once per host + vulnerability
    min_severity: critical         # new findings at or above this severity
    kev: true                      # ... or listed in CISA KEV, regardless of severity
    host_errors: true              # a host that starts failing
    remind_after: 7d               # alert again if still present (0 = never)
  email:
    enabled: false
    host: 192.0.2.25
    port: 25
    security: starttls             # starttls (required) | ssl (implicit TLS, port 465) | none
    tls_verify: true
    tls_server_name: null          # certificate name if `host` is an IP, e.g. mx.example.org
    username: null                 # SMTP AUTH, optional
    password_file: null            # e.g. smtp-password (see Secrets)
    from: aptwarden@example.org
    to: [admin@example.org]
    timeout: 30

hosts:
  - name: proxy01
    address: 192.0.2.10
  - name: mail01
    address: mail01.example.org
    ssh: {port: 2222}
  - name: aptwarden                # the central host itself
    transport: local
