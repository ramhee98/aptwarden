version: 2
updates:
  # The pinned action SHAs in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Propose a version only once it is a week old: compromised or broken
    # releases are usually found and pulled by then. Security updates are not
    # delayed.
    cooldown:
      default-days: 7
  # bandit, pip-audit and zizmor for CI, pinned with hashes
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # PyYAML and jsonschema; the central host uses Debian's packages, so these
  # updates mainly show when the supported versions should be re-checked
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
