version: 2
updates:
  # The pinned action SHAs in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # PyYAML and jsonschema; the central host uses Debian's packages, so these
  # updates mainly show when the supported versions should be re-checked
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
