name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly, for newly published vulnerabilities in dependencies

# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: ShellCheck (the generated helper installer)
        if: matrix.python == '3.13'
        shell: bash  # with pipefail, unlike the default
        run: aptwarden helper show --install | shellcheck -s sh -  # preinstalled on the runner

  debian-packages:
    # Runs with Debian's own packages only, the way the central host is set up.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-yaml \
            python3-jsonschema python3-pytest git openssh-client tzdata
      - run: python3 -m pytest -q

  helper-deb:
    # The root helper as a Debian package (aptwarden-helper_<helper version>_all.deb), built,
    # installed over a manual installation and removed again in a throwaway Debian 13
    # container. Release tags attach it as an artifact.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # SOURCE_DATE_EPOCH: the last commit that changed the packaged files
          persist-credentials: false
      - name: ShellCheck (maintainer scripts and package tools)
        run: |
          shellcheck -s sh contrib/deb/aptwarden-helper/postinst \
            contrib/deb/aptwarden-helper/postrm contrib/deb/test-helper-deb tools/build-helper-deb
      - name: build (twice, the package must be reproducible)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/build-helper-deb dist
          tools/build-helper-deb dist-again
          cmp dist/*.deb dist-again/*.deb
      - name: install, upgrade a manual installation, remove
        run: APTWARDEN_DISPOSABLE=yes contrib/deb/test-helper-deb dist/aptwarden-helper_*_all.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: aptwarden-helper-deb
          path: dist/aptwarden-helper_*_all.deb
          if-no-files-found: error

  security:
    # Static analysis of aptwarden's code, its shell scripts and this workflow, and known
    # vulnerabilities in its dependencies. The security regression tests (size limits,
    # ssh options, healthcheck redirects, ...) run with the unit tests above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: install the tools (pinned with hashes)
        run: pip install --require-hashes -r .github/requirements-ci.txt
      - name: bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit
        run: pip-audit --progress-spinner off .
      - name: zizmor (this workflow)
        run: zizmor --offline .github/workflows
      - name: ShellCheck (root helper)
        run: shellcheck -s sh src/aptwarden/helper/aptwarden-helper  # preinstalled on the runner
      - name: SBOM (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        run: pip-audit --progress-spinner off -f cyclonedx-json -o aptwarden-sbom.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: sbom
          path: aptwarden-sbom.cdx.json

  release:
    # Release tags only, after every other job passed: a GitHub release with the helper
    # package, the SBOM and their SHA256SUMS. Artifacts expire and need a GitHub login;
    # release files stay. The maintainer adds SHA256SUMS.sig afterwards (README, Releases).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, debian-packages, helper-deb, security, codeql, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
      - name: checksums and release notes
        run: |
          mkdir release
          cp artifacts/aptwarden-helper-deb/aptwarden-helper_*_all.deb \
            artifacts/sbom/aptwarden-sbom.cdx.json release/
          (cd release && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS release/
          cat release/SHA256SUMS
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version " 'index($0, h) == 1 {p = 1; next} /^## / {p = 0} p' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          printf '\n---\n\nVerify the files before use: README, "Helper package".\n' >> notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "aptwarden ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # list the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the whole history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # read access to the pull request's commits; no license needed for personal accounts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the token may not comment; findings are in the job summary (redacted)
          GITLEAKS_ENABLE_COMMENTS: "false"
